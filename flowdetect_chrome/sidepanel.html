<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlowDetect para Chrome</title>
    <link rel="stylesheet" href="sidepanel.css?v=0.2.69">
  </head>
  <body>
    <main class="app-shell">
      <input id="importInput" type="file" accept="application/json,.json" multiple hidden>
      <div class="popup-fixed-header">
      <header class="popup-toolbar">
        <div class="popup-brand">
          <img class="popup-brand-icon" src="icons/icon-48.png" alt="">
          <div>
            <p class="brand-kicker">FlowDetect para Chrome</p>
            <h1>Automa&ccedil;&otilde;es</h1>
            <span id="studioConnection" class="studio-connection" title="Aguardando conexao com o Studio">Studio desconectado</span>
          </div>
        </div>
        <div class="popup-tools">
          <label class="import-automation" for="importInput">Importar</label>
          <button id="mapElementButton" class="map-element-button" type="button" title="Mapear elemento da página" aria-label="Mapear elemento da página">Mapear</button>
          <button id="newButton" class="add-automation" type="button"><span>+</span> Adicionar</button>
        </div>
      </header>
      <div class="studio-pair-bar"><span>C&oacute;digo para conectar ao Studio</span><strong id="studioPairCode">······</strong><button id="studioNewPairCode" type="button" title="Gerar novo codigo de conexao">Novo</button></div>
      <span id="studioConnectionCompact" class="studio-connection studio-connection-compact" title="Aguardando conexao com o Studio">Studio desconectado</span>
      <p id="mapElementStatus" class="map-element-status" role="status" aria-live="polite" hidden></p>
      <p id="downloadActivity" class="download-activity" role="status" hidden></p>
      <nav id="workspaceTabs" class="workspace-tabs" role="tablist" aria-label="Áreas do FlowDetect">
        <button id="workspaceAutomations" class="workspace-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="automationList">▦ Automações</button>
        <button id="workspaceAssisted" class="workspace-tab" type="button" role="tab" aria-selected="false" aria-controls="assistedView">◉ Execuções assistidas <span id="assistedLiveCount" class="workspace-live-count" hidden></span></button>
      </nav>
      </div>
      <section class="execution-pages" aria-labelledby="executionPagesHeading">
        <div class="execution-pages-heading">
          <h2 id="executionPagesHeading">Páginas</h2>
          <button id="addExecutionPage" class="execution-page-add" type="button" title="Criar outra página de execução" aria-label="Criar página">+</button>
        </div>
        <nav id="executionPageTabs" aria-label="Selecionar página de execução"></nav>
        <div class="execution-page-target">
          <strong id="executionPageTarget">Selecione uma página.</strong>
          <div class="execution-page-actions">
            <button id="bindExecutionPage" class="execution-page-bind" type="button" title="Vincular ou trocar a aba desta página">Vincular</button>
            <button id="openExecutionPage" class="execution-page-open" type="button" title="Abrir a aba vinculada">Ver aba</button>
          </div>
        </div>
        <p id="executionPageFeedback" role="alert" aria-live="polite" hidden></p>
      </section>
      <section id="automationList" class="automation-list" aria-live="polite"></section>
      <section id="assistedView" class="assisted-view" aria-label="Execuções assistidas" hidden>
        <select id="assistedPageSelect" aria-label="Escolher página para assistir"></select>
        <div id="assistedContent" class="assisted-content" role="region" aria-label="Acompanhamento da página escolhida"></div>
      </section>

    </main>

    <template id="automationTemplate">
      <article class="automation-card">
        <div class="automation-card-top">
          <div class="automation-card-title">
            <div class="automation-card-marker" aria-hidden="true">FD</div>
            <div class="automation-card-copy"><p class="eyebrow automation-source"></p><h2 class="automation-name"></h2></div>
          </div>
          <div class="automation-card-actions">
            <span class="step-count"></span>
            <button class="delete-automation" type="button" aria-label="Excluir automacao" title="Excluir automacao">&times;</button>
          </div>
        </div>
        <button class="resume-run-button" type="button" hidden>Ver última execução</button>
        <div class="loop-start" hidden>
          <label class="loop-start-label"><span>Come&ccedil;ar em</span><select class="loop-start-choice" aria-label="Empresa inicial do loop"></select></label>
        </div>
        <details class="loop-edit-settings" hidden>
          <summary><span>Empresas do loop</span><strong class="loop-edit-count"></strong></summary>
          <div class="loop-edit-body">
            <p>Escolha as empresas pelo nome. O loop continua usando o CNPJ da mesma linha da planilha; CNPJs repetidos s&atilde;o selecionados juntos.</p>
            <label class="loop-search-label">Buscar empresa ou CNPJ<input class="loop-edit-search" type="search" placeholder="Digite nome ou CNPJ" autocomplete="off"></label>
            <div class="loop-edit-list" role="group" aria-label="Empresas inclu&iacute;das no loop"></div>
            <div class="loop-edit-bulk-actions"><button class="loop-include-filtered" type="button">Marcar resultados</button><button class="loop-exclude-filtered" type="button">Desmarcar resultados</button></div>
            <p class="loop-edit-results"></p>
            <div class="loop-edit-footer"><button class="loop-include-all" type="button">Incluir todas</button><label><input class="loop-save-exclusions" type="checkbox"> Salvar exclus&otilde;es nesta automa&ccedil;&atilde;o</label></div>
          </div>
        </details>
        <details class="ocr-edit-settings" hidden>
          <summary>Textos OCR editaveis <span class="ocr-edit-count"></span></summary>
          <div class="ocr-edit-fields"></div>
          <p>Apenas o texto de validacao muda nesta execucao. O ponto de clique permanece. A imagem de referencia ainda mostra o texto original.</p>
          <p class="ocr-edit-error" role="alert" hidden></p>
        </details>
        <p class="run-availability-hint" aria-live="polite" hidden></p>
        <button class="play-button run-automation" type="button"><span class="play-icon" aria-hidden="true">&#9654;</span><span>Executar automa&ccedil;&atilde;o</span></button>
        <details class="download-settings">
          <summary>Downloads</summary>
          <div class="download-settings-body">
            <p>A pasta de destino é definida no Chrome. A alteração vale para os downloads deste perfil do navegador.</p>
            <button class="download-open-settings" type="button">Configurar pasta de downloads ↗</button>
          </div>
        </details>
        <section class="execution" hidden>
          <div class="execution-heading"><p class="execution-kicker">Execu&ccedil;&atilde;o</p><span class="execution-status"></span></div>
          <div class="execution-overview">
            <div class="execution-progress" role="progressbar" aria-label="Progresso da automa&ccedil;&atilde;o" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="execution-progress-value"><strong class="execution-percent">0%</strong><span>conclu&iacute;do</span></div>
              <div class="progress-track"><i class="progress-bar"></i></div>
            </div>
            <label class="execution-company" hidden>
              <span class="execution-company-heading"><span>Empresa</span><span class="execution-company-position"></span></span>
              <select class="execution-company-choice" aria-label="Visualizar empresa sem alterar a execu&ccedil;&atilde;o"></select>
            </label>
          </div>
          <div class="block-carousel" aria-label="Blocos da automa&ccedil;&atilde;o">
            <div class="block-carousel-heading"><span class="block-carousel-automation">Bloco do fluxo</span><span class="block-carousel-count"></span></div>
            <div class="block-carousel-stage"><div class="block-carousel-slide">
              <div class="block-carousel-top"><span class="block-carousel-number"></span><span class="block-carousel-feedback" hidden></span><span class="block-carousel-state"></span></div>
              <h3 class="block-carousel-title"></h3>
              <p class="block-carousel-description"></p>
              <div class="block-carousel-preview"><img class="block-carousel-image" alt="" hidden><div class="block-carousel-placeholder"><span class="block-carousel-placeholder-icon" aria-hidden="true"></span><span class="block-carousel-placeholder-text"></span></div><div class="block-carousel-activity" hidden><div class="block-carousel-activity-heading"><span class="block-carousel-activity-symbol" aria-hidden="true"></span><span class="block-carousel-activity-kind"></span><span class="block-carousel-activity-count"></span></div><div class="block-carousel-activity-content"><span class="block-carousel-activity-label"></span><strong class="block-carousel-activity-value"></strong><span class="block-carousel-activity-caret" aria-hidden="true"></span></div><div class="block-carousel-activity-footer"><span class="block-carousel-activity-dot" aria-hidden="true"></span><span class="block-carousel-activity-message"></span></div></div></div>
              <div class="block-carousel-ocr-progress" role="status" hidden><span class="block-carousel-ocr-label"></span><span class="block-carousel-ocr-track"><span class="block-carousel-ocr-fill"></span></span></div>
              <p class="block-carousel-page"></p>
            </div></div>
            <div class="block-carousel-controls"><button class="block-carousel-prev" type="button" aria-label="Bloco anterior">&#8592;</button><button class="block-carousel-follow" type="button">Acompanhando</button><button class="block-carousel-next" type="button" aria-label="Pr&oacute;ximo bloco">&#8594;</button><button class="stop-button" type="button" hidden>Parar</button><button class="block-carousel-manager" type="button" hidden>Automa&ccedil;&otilde;es</button></div>
            <button class="report-button" type="button" hidden>Gerar relat&oacute;rio PDF</button>
          </div>
          <section class="live-steps" aria-label="Etapas recentes"><div class="live-steps-heading"><span>Ao vivo</span><span class="live-steps-count"></span></div><ul class="live-steps-list" aria-live="polite"></ul></section>
          <div class="execution-loop-summary">
            <label class="execution-column-label" hidden><span>Exibir</span><select class="execution-column-choice" aria-label="Coluna exibida durante a execucao"></select></label>
            <p class="execution-summary">Preparando execucao</p>
          </div>
          <details class="run-log-details"><summary>Hist&oacute;rico da execu&ccedil;&atilde;o</summary><ul class="run-log" aria-label="Logs da execucao" aria-live="polite"></ul></details>
        </section>
      </article>
    </template>
    <script src="report-generator.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
