<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlowDetect para Chrome</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="app-shell">
      <input id="importInput" type="file" accept="application/json,.json" hidden>
      <header class="popup-toolbar">
        <span>Automa&ccedil;&otilde;es</span>
        <div class="popup-tools">
          <label class="import-automation" for="importInput">Importar</label>
          <button id="newButton" class="add-automation" type="button">+ Adicionar</button>
        </div>
      </header>
      <section id="automationList" class="automation-list" aria-live="polite"></section>
    </main>

    <template id="automationTemplate">
      <article class="automation-card">
        <div class="automation-card-top">
          <div class="automation-card-title"><p class="eyebrow automation-source"></p><h1 class="automation-name"></h1></div>
          <div class="automation-card-actions">
            <span class="step-count"></span>
            <button class="delete-automation" type="button" aria-label="Excluir automacao" title="Excluir automacao">&times;</button>
          </div>
        </div>
        <button class="play-button run-automation" type="button"><span>&#9654;</span> Executar</button>
        <section class="execution" hidden>
          <div class="execution-top"><span class="execution-status"></span><strong class="execution-percent">0%</strong></div>
          <p class="execution-summary">0 de 0 blocos</p>
          <div class="progress-track" aria-label="Progresso da automação"><i class="progress-bar"></i></div>
          <button class="stop-button" type="button" hidden>Parar execução</button>
          <ul class="run-log" aria-label="Logs da execução" aria-live="polite"></ul>
        </section>
      </article>
    </template>
    <script src="sidepanel.js"></script>
  </body>
</html>
