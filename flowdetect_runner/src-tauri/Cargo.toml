[package]
name = "flowdetect_runner"
version = "1.0.0"
description = "Executor simples de uma automacao FlowDetect"
authors = ["Kaua Ananias"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0
incremental = false
codegen-units = 8

[profile.dev.build-override]
debug = 0
incremental = false
